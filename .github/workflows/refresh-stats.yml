name: Refresh Stats Badges

on:
  schedule:
    - cron: "0 */2 * * *"  # Every 2 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Add cache-busting timestamp to stats badges
        run: |
          TIMESTAMP=$(date +%s)
          python3 - "$TIMESTAMP" <<'EOF'
          import re
          import sys

          ts = sys.argv[1]
          assert ts.isdigit(), f"Unexpected timestamp: {ts!r}"

          with open("README.md", encoding="utf-8") as f:
              content = f.read()

          # Markdown image/link URLs for third-party badge services.
          md_pattern = re.compile(
              r'\((https://github-profile-summary-cards\.vercel\.app[^)]*)\)'
          )

          # HTML img src for the locally-generated streak SVG.
          img_pattern = re.compile(
              r'(src="https://raw\.githubusercontent\.com/NikunjS91/NikunjS91/main/assets/streak\.svg)(?:[?][^"]*)?"'
          )

          def bust_md(match):
              url = re.sub(r'[?&]t=\d+', '', match.group(1)).rstrip('&').rstrip('?')
              sep = '&' if '?' in url else '?'
              return f'({url}{sep}t={ts})'

          def bust_img(match):
              return f'{match.group(1)}?t={ts}"'

          new_content = md_pattern.sub(bust_md, content)
          new_content = img_pattern.sub(bust_img, new_content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          EOF

      - name: Commit updated timestamps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh stat badge cache [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts" && exit 1
