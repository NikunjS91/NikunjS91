name: Refresh Stats Badges

on:
  schedule:
    - cron: "0 */2 * * *"  # Every 2 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add cache-busting timestamp to stats badges
        run: |
          TIMESTAMP=$(date +%s)
          python3 - "$TIMESTAMP" <<'EOF'
          import re
          import sys

          ts = sys.argv[1]

          with open("README.md", encoding="utf-8") as f:
              content = f.read()

          # Match Markdown image/link URLs pointing at the badge services.
          pattern = re.compile(
              r'\((https://(?:github-profile-summary-cards\.vercel\.app'
              r'|streak-stats\.demolab\.com)[^)]*)\)'
          )

          def bust(match):
              url = re.sub(r'&t=\d+', '', match.group(1))  # strip old timestamp
              return f'({url}&t={ts})'

          new_content = pattern.sub(bust, content)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          EOF

      - name: Commit updated timestamps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh stat badge cache [skip ci]"
          git push
